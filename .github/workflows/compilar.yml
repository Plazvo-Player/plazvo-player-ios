# Compila o app num Mac da nuvem, abre no simulador e guarda as fotos das telas.
name: Compilar

on:
  push:
    branches: [main, "v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulador:
    name: Compilar e fotografar (${{ matrix.maquina }})
    runs-on: ${{ matrix.maquina }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        # Dois tipos de Mac: vale o resultado do que conseguir uma máquina primeiro.
        maquina: [macos-latest, macos-15-intel]
    env:
      MAQUINA: ${{ matrix.maquina }}
    steps:
      # A chave do repositório só vai para os passos que falam com ele (baixar o código, guardar
      # o pacote e guardar o resultado); os outros, que rodam ferramentas de fora, não a recebem.
      - name: Baixar o código
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git init -q .
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Ambiente
        run: bash ci/ambiente.sh

      - name: Testar a lógica
        run: bash ci/testar-logica.sh

      - name: Buscar o motor de vídeo
        run: bash ci/motor-de-video.sh

      - name: Compilar para o simulador
        run: bash ci/compilar.sh

      - name: Montar o pacote do aparelho
        # Se o pacote não sair, as fotos são tiradas do mesmo jeito (o resumo diz o que houve).
        continue-on-error: true
        run: bash ci/pacote.sh

      - name: Guardar o pacote do aparelho
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/guardar-pacote.sh

      - name: Abrir no simulador e fotografar
        # Se as fotos passarem do tempo, o que já saiu ainda é guardado no passo seguinte.
        timeout-minutes: 55
        run: bash ci/fotografar.sh

      - name: Guardar o resultado
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/guardar.sh
