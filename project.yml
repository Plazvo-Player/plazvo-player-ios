# Receita do projeto do Xcode (XcodeGen). O .xcodeproj é gerado na hora de compilar.
name: PlazvoPlayer
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
# A lógica do app (sem tela) é um pacote à parte, na pasta Core.
packages:
  PlazvoCore:
    path: Core
targets:
  PlazvoPlayer:
    type: application
    platform: iOS
    sources:
      - path: App
        # O Info.plist é usado pela compilação (INFOPLIST_FILE); não é copiado para dentro do app.
        excludes:
          - Info.plist
    dependencies:
      - package: PlazvoCore
      # O motor de vídeo (VLC). Não fica no repositório: ci/motor-de-video.sh baixa do endereço
      # oficial do VLC e confere o arquivo antes de usar.
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plazvo.player
        PRODUCT_NAME: PlazvoPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # O Info.plist do app sai da soma de App/Info.plist (a cor da tela de abertura) com as
        # chaves INFOPLIST_KEY_ daqui.
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plazvo Player
        # O app tem um único tema, escuro: a barra do alto e o teclado acompanham.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
schemes:
  PlazvoPlayer:
    build:
      targets:
        PlazvoPlayer: all
    run:
      config: Debug
    archive:
      config: Release
